name: Local integration test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mattermost: ['11.7.14', '12.0.0']
    env:
      MATTERMOST_VERSION: ${{ matrix.mattermost }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Start, install and test
        run: make dev-up dev-setup dev-smoke
      - name: Verify Alertmanager HA deduplication
        run: make dev-ha-up dev-ha-smoke
      - name: Container logs
        if: failure()
        run: docker compose -f hack/docker-compose.yaml -f hack/docker-compose.ha.yaml logs --tail=100
      - name: Stop containers
        if: always()
        run: make dev-ha-down
