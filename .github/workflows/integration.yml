name: Local integration test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mattermost: ['11.7.14', '12.0.0']
    env:
      MATTERMOST_VERSION: ${{ matrix.mattermost }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.27'
          check-latest: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Start, install and test
        run: make dev-up dev-setup dev-smoke
      - name: Container logs
        if: failure()
        run: docker compose -f hack/docker-compose.yaml logs --tail=100
      - name: Stop containers
        if: always()
        run: make dev-down
