version: 2

project_name: mattermost-plugin-alertmanager

dist: goreleaser

changelog:
  use: github-native

builds:
  - skip: true

before:
  hooks:
    - make clean
    - make dist
    - sh -c "cosign sign-blob --yes --timeout 360s --bundle dist/alertmanager-{{ .Version }}.sigstore.json dist/alertmanager-{{ .Version }}.tar.gz"

checksum:
  extra_files:
    - glob: ./dist/alertmanager-{{ .Version }}.tar.gz

release:
  prerelease: auto
  github:
    owner: cpanato
    name: mattermost-plugin-alertmanager

  extra_files:
    - glob: ./dist/alertmanager-{{ .Version }}.tar.gz
    - glob: ./dist/alertmanager-{{ .Version }}.sigstore.json
