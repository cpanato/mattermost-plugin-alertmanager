global:
  resolve_timeout: 1m
route:
  receiver: mattermost
  group_by: [alertname]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 30m
receivers:
  - name: mattermost
    webhook_configs:
      - send_resolved: true
        url: 'http://mattermost:8065/plugins/alertmanager/api/webhook?token=local-development-token'
